<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>등불지기</title>
    <!-- 홈 화면에 추가하면 주소창 없이 전체 화면으로 실행 (아이폰 사파리는 페이지가 주소창을 숨길 수 없음) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="등불지기">
    <!-- 캔버스를 창 전체에 꽉 채운다. 640×360 비율 맞추기는 게임 안(Pixel Perfect Camera·UIScaler)에서 한다. -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
                   overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh;
                      display: block; background: #000; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                 color: #e6dcbe; font: 16px sans-serif; pointer-events: none; }
      /* 구글 로그인 버튼 (구글이 그림) — 계정 창이 열렸을 때만 게임이 위치를 정해 띄운다 (GoogleSignIn.jslib) */
      #g-btn { position: fixed; z-index: 10; display: none; }
    </style>
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="g-btn"></div>
    <div id="loading">불러오는 중… 0%</div>
    <script src="Build/WebGL.loader.js?v=28"></script>
    <script>
      var loading = document.getElementById("loading");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb?v=28",
        frameworkUrl: "Build/WebGL.framework.js.unityweb?v=28",
        codeUrl: "Build/WebGL.wasm.unityweb?v=28",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "LanternKeeper",
        productName: "등불지기",
        productVersion: "1.0",
      }, function (p) {
        loading.textContent = "불러오는 중… " + Math.round(p * 100) + "%";
      }).then(function () {
        loading.remove();
      }).catch(function (message) {
        loading.textContent = message;
      });
    </script>
  </body>
</html>
