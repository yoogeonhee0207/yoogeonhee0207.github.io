name: 블로그 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 * * *'   # 매일 한국 시간 자정에 커밋 기록 새로고침
  workflow_dispatch:         # Actions 탭에서 직접 실행
  repository_dispatch:       # 게임 저장소에서 "game-updated" 신호를 보내면 실행
    types: [game-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 게임 저장소 커밋 기록 가져오기
        run: npm run commits
        env:
          GAME_REPO_TOKEN: ${{ secrets.GAME_REPO_TOKEN }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
